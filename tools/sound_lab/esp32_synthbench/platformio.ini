; 音源の性能を測るための、使い捨ての測定用プロジェクト（本番のファームとは無関係。NVS には触らない）
[env:bench_os]
platform = espressif32
board = freenove_esp32_s3_wroom
framework = arduino
monitor_speed = 115200

[env:bench_o2]
platform = espressif32
board = freenove_esp32_s3_wroom
framework = arduino
monitor_speed = 115200
build_unflags = -Os
build_flags = -O2
