# ゲーム（game/ フォルダ）を、GitHub Pages に公開する。
#   main にプッシュすると、game/ の中身が変わったときだけ、自動で公開し直す。
#   初回だけ、GitHub の Settings > Pages > Build and deployment > Source を「GitHub Actions」にする。
name: Pages に公開

on:
  push:
    branches: [main]
    paths: ['game/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 公開するファイルを集める（テストは入れない）
        run: |
          mkdir _site
          cp -R game/. _site/
          rm -rf _site/test _site/dev.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
