# ゲーム（game/ フォルダ）を、GitHub Pages に公開する。
#   main にプッシュすると、game/ の中身が変わったときだけ、自動で公開し直す。
#   初回だけ、GitHub の Settings > Pages > Build and deployment > Source を「GitHub Actions」にする。
name: Pages に公開

on:
  push:
    branches: [main]
    paths: ['game/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 集める（build）と、公開する（deploy）を、2つの job に分ける。
  #   以前は 1つの job で、アップロードの直後に公開していた。そのとき、GitHub 側で、アップロードした成果物（github-pages）が、まだ見えず、
  #   「No artifacts named "github-pages" were found」で、まれに失敗した（2026-11-24 に、直近 6回中 3回）。job を分けると、公開の前に、少し間があく
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 公開するファイルを集める（テストは入れない）
        run: |
          mkdir _site
          cp -R game/. _site/
          rm -rf _site/test _site/dev.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
