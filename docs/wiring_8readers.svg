<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1010" viewBox="0 0 1300 1010" font-family="Hiragino Sans, Noto Sans JP, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="34" font-size="26" text-anchor="start" font-weight="bold" fill="#111">RC522 ×8 の配線図（個別の2本: SDA と RST）</text>
<text x="20" y="60" font-size="14" text-anchor="start" font-weight="normal" fill="#444">リーダー1〜4 は、これまでの配線のまま。リーダー5〜8（太い枠）を、新しくつなぐ。実線 = SDA、破線 = RST。</text>
<text x="20" y="84" font-size="14" text-anchor="start" font-weight="normal" fill="#444">共通の5本（3.3V / GND / SCK / MOSI / MISO）は、8台すべてに同じ線を枝分かれさせる（README 3-7）。IRQ は、どこにもつながない。</text>
