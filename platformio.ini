; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:freenove_esp32_s3_wroom]
platform = espressif32
board = freenove_esp32_s3_wroom
framework = arduino
monitor_speed = 115200
monitor_echo = yes
lib_deps = miguelbalboa/MFRC522@^1.4.12
; 書き込み（VSCode の Upload ボタン = pio run -t upload）は、tools/upload.sh に任せる。
;   理由: このフォルダ名には括弧 ( ) が入っていて、PlatformIO 標準の書き込みコマンドは、パスを引用符で囲まないので、途中で壊れる。
;   upload.sh は、常駐ブリッジを止めてから esptool で書き、終わったらブリッジを再開する。
upload_command = sh "$PROJECT_DIR/tools/upload.sh" --no-build "$UPLOAD_PORT"
; クリック1つのタスク（PlatformIO の Project Tasks > Custom）: ブリッジ接続・リズム・コード編集を開く・ゲームを開く
extra_scripts = tools/pio_targets.py
